<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#08080a">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta name="twitter:card" content="summary_large_image">

  <link rel="preload" href="assets/fonts/manrope-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/instrument-serif-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/lobby.css">
  <link rel="stylesheet" href="css/games.css">

  <script>
    // Apply the saved theme before first paint so there's no flash.
    try {
      var t = localStorage.getItem('cc:theme');
      if (t === '"light"' || t === '"dark"') document.documentElement.dataset.theme = JSON.parse(t);
      if (localStorage.getItem('cc:motion') === '"reduced"') document.documentElement.dataset.motion = 'reduced';
    } catch (e) {}
  </script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="arc arc-a"></div>
    <div class="arc arc-b"></div>
    <div class="arc arc-c"></div>
    <div class="grain"></div>
  </div>

  <a class="skip-link" href="#app">Skip to content</a>

  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="CrankedCasino home">
        <span class="brand-tile"><img src="assets/img/logo-tile.png" alt="" width="44" height="44" onerror="this.remove()"></span>
        <span class="brand-name">Cranked<span class="brand-dim">Casino</span></span>
      </a>
      <nav class="topnav" aria-label="Games">
        <a href="#/mines" data-nav="mines">Mines</a>
        <a href="#/plinko" data-nav="plinko">Plinko</a>
        <a href="#/slots" data-nav="slots">Slots</a>
        <a href="#/crash" data-nav="crash">Crash</a>
        <a href="#/leaderboard" data-nav="leaderboard">Leaderboard</a>
      </nav>
      <div class="topbar-actions">
        <button class="balance-pill" id="balanceBtn" type="button" aria-haspopup="dialog" aria-label="Wallet">
          <span class="chip-ico" aria-hidden="true"></span>
          <span class="bal-num" id="balanceNum">1,000.00</span>
          <span class="sync-dot" id="syncDot" aria-hidden="true"></span>
        </button>
        <button class="icon-btn gh-btn" id="ghBtn" type="button" aria-label="Sign in with GitHub"></button>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle light and dark theme"></button>
        <button class="icon-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="drawer"></button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-foot" id="siteFoot"></footer>

  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-scrim" data-close></div>
    <aside class="drawer-panel" role="dialog" aria-modal="true" aria-label="Menu"></aside>
  </div>

  <div class="popover" id="wallet" role="dialog" aria-label="Wallet" hidden></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <noscript><p class="noscript">CrankedCasino needs JavaScript to deal the cards.</p></noscript>
</body>
</html>
