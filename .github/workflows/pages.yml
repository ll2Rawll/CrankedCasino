# Publishes the casino to GitHub Pages when Settings → Pages → Source is
# "GitHub Actions". With "Deploy from a branch" (the current setting), GitHub's
# own "pages build and deployment" run publishes the site instead, and the
# deploy job below is skipped, so this workflow never fails or double-deploys.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/crankedcasino-website-tkxsgz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-actions
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.source.outputs.build_type }}
    steps:
      - name: Check the Pages source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          type=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" | jq -r '.build_type // "none"' || echo "none")
          echo "build_type=$type" >> "$GITHUB_OUTPUT"
          echo "Pages source: $type"
          if [ "$type" != "workflow" ]; then
            echo "::notice title=Published by branch deploy::Pages source is '$type', so GitHub's own pages build publishes the site."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
