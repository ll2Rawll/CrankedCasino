<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>OG image</title>
<link rel="stylesheet" href="../css/base.css">
<style>
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; display: block; background: #08080a; }
  .og { position: relative; width: 1200px; height: 630px; overflow: hidden; display: grid; grid-template-columns: 1fr 430px; align-items: center; padding: 0 70px; gap: 30px; }
  .og::before { content: ""; position: absolute; width: 1500px; height: 1500px; left: -900px; top: -380px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.06), rgba(255,255,255,.025) 80%, transparent); }
  .og h1 { font-family: var(--font-display); font-weight: 400; font-size: 132px; line-height: .86; letter-spacing: -.025em; color: #f3f0ea; }
  .og h1 em { color: rgba(243,240,234,.62); }
  .og p { margin-top: 26px; font-size: 30px; color: rgba(243,240,234,.66); max-width: 22ch; line-height: 1.3; }
  .og .tags { display: flex; gap: 10px; margin-top: 34px; }
  .og .tags span { padding: 10px 18px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.18); color: #f3f0ea; font-weight: 700; font-size: 20px; }
  .arch { position: relative; width: 400px; border: 1.5px solid rgba(255,255,255,.22); overflow: hidden; background: radial-gradient(120% 70% at 50% 0%, rgba(255,255,255,.07), transparent 60%), linear-gradient(180deg,#1b1b20,#0b0b0e); }
  .arch img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
  <div class="og">
    <div>
      <h1>Cranked<em>Casino</em></h1>
      <p>Fake chips, real fun. Saved to your GitHub.</p>
      <div class="tags"><span>Mines</span><span>Plinko</span><span>Slots</span><span>Crash</span></div>
    </div>
    <div class="arch"><img src="../assets/img/hero-logo.webp" alt=""></div>
  </div>
</body>
</html>
