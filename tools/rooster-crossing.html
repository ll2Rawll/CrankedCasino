<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>River crossing motion study · Road Rooster</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; background: #172d32; color: #fff7df; font: 1rem system-ui }
  main { width: min(100%, 390px); margin: auto }
  canvas { display: block; width: 100%; height: min(76dvh, 690px); background: #97bd52 }
  footer { padding: 12px; display: grid; grid-template-columns: auto 1fr; gap: 10px }
  button { background: #f5e8bd; color: #203c39; border: 0; border-radius: 8px; min-width: 72px; min-height: 44px }
  input { width: 100% }
</style>
<main>
  <canvas aria-label="A rooster hops from grass onto a moving log, rides it, then lands on a lily pad."></canvas>
  <footer><button type="button">Pause</button><input type="range" min="0" max="4" step="0.01" value="0" aria-label="Crossing replay time in seconds"></footer>
</main>
<script type="module">
import { landscape } from '../js/games/rooster-landscape.js?v=0f27056399f9';
import { scoreLane } from '../js/games/rooster-course.js?v=0f27056399f9';

const canvas = document.querySelector('canvas');
const scene = landscape(canvas.getContext('2d'));
const button = document.querySelector('button');
const scrub = document.querySelector('input');
const grass = { kind: 'safe', blocked: [] };
const log = { kind: 'river', speed: .7, offset: 2.6, period: 4, width: 2.5, blocked: [] };
const pad = { kind: 'river', pads: true, speed: 0, offset: 0, period: 2, width: .88, blocked: [] };
function lane(row) {
  if (row === 1 || row === 3) return log;
  if (row === 2) return pad;
  return row <= 0 || row === 4 ? grass : scoreLane(31, row);
}

let playing = !matchMedia('(prefers-reduced-motion: reduce)').matches;
let time = 0, previous;
function frame(now) {
  const dt = previous === undefined ? 0 : Math.min(.05, (now - previous) / 1000);
  previous = now;
  if (playing) time = (time + dt) % 4;
  const W = canvas.clientWidth, H = canvas.clientHeight, dpr = Math.min(devicePixelRatio, 2);
  if (canvas.width !== Math.round(W*dpr) || canvas.height !== Math.round(H*dpr)) {
    canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  }
  const second = time >= 2;
  const start = second ? 2 : .7;
  const u = Math.min(1, Math.max(0, (time - start) / .11));
  const travel = u * (2 - u);
  const drift = t => 3 + .7 * (t - .7);
  const vc = second ? drift(2) + (4 - drift(2)) * travel : 3 + (drift(time) - 3) * travel;
  const at = start + .11;
  const age = time - at;
  scene.draw({W,H,dpr,dt:1,seed:31,lane,t:time,now:time*1000,vr:Number(second)+travel,vc,
    hop:1.28*u*(1-u),squash:age>=0 && age<.075 ? .10*Math.sin(Math.PI*age/.075) : 0,
    touchdown:age>=0 ? {at:at*1000,row:second?2:1,x:second?4:drift(at),platform:second?2:0} : null,
    facing:1,score:true,phase:'run',line:0,trainWarning:()=>false});
  if (playing) scrub.value = time;
  requestAnimationFrame(frame);
}
function setPlayback(on) { playing = on; button.textContent = on ? 'Pause' : 'Play'; }
button.onclick = () => setPlayback(!playing);
scrub.oninput = () => { setPlayback(false); time = Number(scrub.value); };
setPlayback(playing);
requestAnimationFrame(frame);
</script>
</html>
