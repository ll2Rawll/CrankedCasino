<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Road Rooster frame timing</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0 auto; max-width: 850px; background: #15262b; color: #f7f4df; font: 1rem system-ui }
  canvas { display: block; width: 100%; height: min(70dvh, 600px); background: #97bd52 }
  button { padding: .65rem 1rem; font: inherit }
  p { padding-inline: .75rem }
  output { line-height: 1.5 }
</style>
<canvas aria-label="Fixed-seed Road Rooster course"></canvas>
<p><button type="button" id="run">Run frame test</button></p>
<p><output id="result" aria-live="polite">Keep this tab in view for 150 frames.</output></p>
<script type="module">
import { landscape } from '../js/games/rooster-landscape.js';
import { scoreLane } from '../js/games/rooster-course.js';

const canvas = document.querySelector('canvas');
const button = document.querySelector('#run');
const output = document.querySelector('#result');
const ctx = canvas.getContext('2d', { alpha: false });
let interrupted = false;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) interrupted = true;
});
button.onclick = async () => {
  button.disabled = true;
  interrupted = false;
  output.textContent = 'Measuring…';
  try {
    const W = canvas.clientWidth, H = canvas.clientHeight, dpr = Math.min(devicePixelRatio, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    const scene = landscape(ctx), seed = 31;
    const lanes = new Map();
    const lane = row => {
      if (!lanes.has(row)) lanes.set(row, scoreLane(seed, row));
      return lanes.get(row);
    };
    const gaps = [];
    let previous, firstDraw;
    for (let i = 0; i < 150; i++) {
      await new Promise(requestAnimationFrame);
      if (interrupted || canvas.clientWidth !== W || canvas.clientHeight !== H) {
        output.textContent = 'The tab or playfield changed. Run the test again.';
        return;
      }
      const start = performance.now();
      if (i >= 12) gaps.push(start - previous);
      previous = start;
      scene.draw({ W, H, dpr, dt: .016, seed, lane, t: i / 60, now: i * 1000 / 60,
        vr: 6 + i / 100, vc: 3 + .4 * Math.sin(i / 40), hop: 0, squash: 0, facing: 1,
        score: true, phase: 'run', line: 0, trainWarning: () => false });
      if (i === 0) firstDraw = performance.now() - start;
    }
    gaps.sort((a, b) => a - b);
    const percentile = p => gaps[Math.floor(gaps.length * p)].toFixed(1);
    output.textContent = `${canvas.width} × ${canvas.height} pixels. Median frame interval ${percentile(.5)} ms. 95th percentile ${percentile(.95)} ms. First draw call ${firstDraw.toFixed(1)} ms.`;
  } finally {
    button.disabled = false;
  }
};
</script>
</html>
