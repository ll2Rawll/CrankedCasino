<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Asset renderer</title>
<style>html,body{margin:0;background:transparent} #box{width:600px;height:750px} canvas{width:100%;height:100%;display:block}</style>
</head>
<body>
<div id="box"><canvas id="c"></canvas></div>
<script type="module">
  // Renders the 3D card art to PNG. Driven by tools/render-assets.mjs.
  import { createHero } from './art3d.js?v=e08da9841def';
  const font = new FontFace('Bricolage', 'url(../assets/fonts/bricolage-var.woff2)', { weight: '200 800', stretch: '75% 100%' });
  await font.load();
  document.fonts.add(font);
  const box = document.getElementById('box');
  window.hero = createHero(document.getElementById('c'), { interactive: false, initial: 'mines' });
  window.setSize = (w, h) => { box.style.width = w + 'px'; box.style.height = h + 'px'; };
  window.ready = true;
</script>
</body>
</html>
